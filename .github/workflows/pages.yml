name: Pages

# Rebuild the download page when its sources change on master, without waiting
# for the next release. The site is rebuilt around the latest stable release:
# each deploy replaces the whole site, so its files and `latest.json` (read by
# the in-app updater) are republished from that release's assets.
on:
  push:
    branches: [master]
    paths:
      - 'pages/**'
      - 'scripts/build-pages.py'
      - 'scripts/build-site.sh'
      - 'assets/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the `pages` job of release.yml: never two deploys at once, none cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::error::No stable release to publish"
            exit 1
          fi
          echo "Latest stable release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bash scripts/build-site.sh "$TAG" "$BASE_URL" artifacts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
