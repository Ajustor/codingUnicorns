name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The in-app updater compares the release tag with the version compiled into the
      # binary (CARGO_PKG_VERSION); a mismatch would make every client re-offer the update.
      - name: Compare versions
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      # Users can't read the (private) repository: the changelogs (English and
      # French) are what tell them what changed, on the download page and in
      # the update dialog.
      - name: Check changelog entries
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          status=0
          for file in CHANGELOG.md CHANGELOG.fr.md; do
            if ! python3 scripts/changelog.py "$file" "$GITHUB_REF_NAME" > /dev/null; then
              echo "::error::$file has no '## [${GITHUB_REF_NAME#v}]' section"
              status=1
            fi
          done
          exit $status

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    env:
      # Authenticode signing is opt-in: it only runs when both secrets are set.
      # Secrets can't be referenced in `if:` directly, hence this flag.
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coding-unicorns-linux-x64

          #- os: macos-latest
          #  target: x86_64-apple-darwin
          #  artifact: coding-unicorns-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coding-unicorns-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coding-unicorns-windows-x64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            desktop-file-utils

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # The binary must start on a bare system: no Homebrew library on macOS,
      # no OpenSSL / libgit2 / libssh2 from the build machine on Linux.
      - name: Check linked libraries
        if: matrix.os != 'windows-latest'
        run: bash scripts/check-linked-libs.sh target/${{ matrix.target }}/release/coding-unicorns

      # ── Windows code signing (optional) ────────────────────────────────────
      # The exe is signed in place right after the build, so every copy made
      # below (the uploaded .exe and the one packed into the MSI) is signed, and
      # the sha256 hashes in latest.json (computed from the uploaded artifacts
      # in the `pages` job) match the signed files.

      - name: Prepare code signing (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          "CODESIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign binary (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = "target\${{ matrix.target }}\release\coding-unicorns.exe"
          & $env:SIGNTOOL sign /f $env:CODESIGN_PFX /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /d "Coding Unicorns" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $exe" }
          & $env:SIGNTOOL verify /pa $exe
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $exe" }

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/coding-unicorns ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/coding-unicorns.exe ${{ matrix.artifact }}

      # ── Linux / macOS packages ─────────────────────────────────────────────
      # The bare binaries above stay published: installs from them (and older
      # versions) keep updating themselves from them.

      - name: Build AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build-appimage.sh target/${{ matrix.target }}/release/coding-unicorns coding-unicorns-linux-x64.AppImage

      - name: Build app and disk image (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/build-macos-app.sh target/${{ matrix.target }}/release/coding-unicorns coding-unicorns-macos-arm64.dmg

      - name: Open the app (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/smoke-test-macos-app.sh coding-unicorns-macos-arm64.dmg "Coding Unicorns" coding-unicorns "$HOME/Library/Application Support/coding-unicorns/crash.log"

      # ── Windows extras ─────────────────────────────────────────────────────

      - name: Export icon (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Copy the release binary to target/release/ so the WiX manifest
          # finds it at the expected relative path.
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item target\${{ matrix.target }}\release\coding-unicorns.exe `
                    target\release\coding-unicorns.exe -Force

          # Convert PNG → ICO using built-in Windows APIs (no extra tools needed)
          .\scripts\New-Icon.ps1 `
            -Source      assets\icon.png `
            -Destination assets\icon.ico

      - name: Build Windows installer (MSI)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # WiX Toolset v3 is pre-installed on windows-latest runners.
          # Locate candle.exe and light.exe.
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDir) {
            choco install wixtoolset --no-progress -y
            $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" |
                      Sort-Object Name -Descending | Select-Object -First 1
          }
          $candle = Join-Path $wixDir.FullName "bin\candle.exe"
          $light  = Join-Path $wixDir.FullName "bin\light.exe"

          # MSI ProductVersion must follow the release, or MajorUpgrade won't replace
          # older installs. Strip any pre-release suffix (MSI only accepts x.y.z).
          $version = "${{ github.ref_name }}".TrimStart('v').Split('-')[0]
          & $candle -arch x64 "-dProductVersion=$version" -out wix\main.wixobj wix\main.wxs
          & $light  -ext WixUIExtension -out coding-unicorns-setup.msi wix\main.wixobj

      - name: Sign installer (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $msi = 'coding-unicorns-setup.msi'
          & $env:SIGNTOOL sign /f $env:CODESIGN_PFX /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /d "Coding Unicorns Installer" $msi
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $msi" }
          & $env:SIGNTOOL verify /pa $msi
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $msi" }

      - name: Remove signing certificate (Windows)
        if: always() && matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX -and (Test-Path $env:CODESIGN_PFX)) {
            Remove-Item $env:CODESIGN_PFX -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-linux-x64-appimage
          path: coding-unicorns-linux-x64.AppImage

      - name: Upload disk image (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-macos-arm64-dmg
          path: coding-unicorns-macos-arm64.dmg

      - name: Upload Windows installer (MSI)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-setup-msi
          path: coding-unicorns-setup.msi

      - name: Upload icon (ICO)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-icon-ico
          path: assets/icon.ico

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      # The release text is the version's CHANGELOG.md section; pre-releases
      # without one fall back to GitHub's generated notes.
      - name: Release notes
        id: notes
        run: |
          if python3 scripts/changelog.py CHANGELOG.md "$GITHUB_REF_NAME" > release-notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            : > release-notes.md
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Coding Unicorns ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            artifacts/**/*
          generate_release_notes: ${{ steps.notes.outputs.generate }}

  # The repository is private, so clients can't read releases through the GitHub API.
  # Publish the binaries plus a `latest.json` manifest to GitHub Pages (public), which is
  # what the in-app updater reads (src/updater/mod.rs, MANIFEST_URL). Each deploy replaces
  # the whole site, so only the latest stable release is hosted.
  pages:
    name: Publish to GitHub Pages
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Shared with pages.yml: never two deploys at once, none cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The page template, its build script and the icon live in the repository.
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bash scripts/build-site.sh "$TAG" "$BASE_URL" artifacts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
