name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The in-app updater compares the release tag with the version compiled into the
      # binary (CARGO_PKG_VERSION); a mismatch would make every client re-offer the update.
      - name: Compare versions
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coding-unicorns-linux-x64

          #- os: macos-latest
          #  target: x86_64-apple-darwin
          #  artifact: coding-unicorns-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coding-unicorns-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coding-unicorns-windows-x64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libglib2.0-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/coding-unicorns ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/coding-unicorns.exe ${{ matrix.artifact }}

      # ── Windows extras ─────────────────────────────────────────────────────

      - name: Export icon (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Copy the release binary to target/release/ so the WiX manifest
          # finds it at the expected relative path.
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item target\${{ matrix.target }}\release\coding-unicorns.exe `
                    target\release\coding-unicorns.exe -Force

          # Convert PNG → ICO using built-in Windows APIs (no extra tools needed)
          .\scripts\New-Icon.ps1 `
            -Source      assets\icon.png `
            -Destination assets\icon.ico

      - name: Build Windows installer (MSI)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # WiX Toolset v3 is pre-installed on windows-latest runners.
          # Locate candle.exe and light.exe.
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDir) {
            choco install wixtoolset --no-progress -y
            $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" |
                      Sort-Object Name -Descending | Select-Object -First 1
          }
          $candle = Join-Path $wixDir.FullName "bin\candle.exe"
          $light  = Join-Path $wixDir.FullName "bin\light.exe"

          # MSI ProductVersion must follow the release, or MajorUpgrade won't replace
          # older installs. Strip any pre-release suffix (MSI only accepts x.y.z).
          $version = "${{ github.ref_name }}".TrimStart('v').Split('-')[0]
          & $candle -arch x64 "-dProductVersion=$version" -out wix\main.wixobj wix\main.wxs
          & $light  -ext WixUIExtension -out coding-unicorns-setup.msi wix\main.wixobj

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload Windows installer (MSI)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-setup-msi
          path: coding-unicorns-setup.msi

      - name: Upload icon (ICO)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coding-unicorns-icon-ico
          path: assets/icon.ico

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Coding Unicorns ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
          generate_release_notes: true

  # The repository is private, so clients can't read releases through the GitHub API.
  # Publish the binaries plus a `latest.json` manifest to GitHub Pages (public), which is
  # what the in-app updater reads (src/updater/mod.rs, MANIFEST_URL). Each deploy replaces
  # the whole site, so only the latest stable release is hosted.
  pages:
    name: Publish to GitHub Pages
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          dir="site/download/$TAG"
          mkdir -p "$dir"
          find artifacts -type f ! -name '*.ico' -exec cp {} "$dir/" \;

          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

          assets='[]'
          rows=''
          for f in "$dir"/*; do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            url="$BASE_URL/download/$TAG/$name"
            assets=$(jq --arg name "$name" --arg url "$url" --arg sha "$sha" \
              '. + [{name: $name, url: $url, sha256: $sha}]' <<<"$assets")
            rows="$rows<li><a href=\"download/$TAG/$name\">$name</a><br><code>sha256 $sha</code></li>"
          done

          jq -n --arg version "${TAG#v}" --arg notes "$notes" --arg page "$BASE_URL/" \
            --argjson assets "$assets" \
            '{version: $version, notes: $notes, page_url: $page, assets: $assets}' \
            > site/latest.json

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Coding Unicorns $TAG</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 16px; background: #1e1e1e; color: #d4d4d4; }
            a { color: #4fa3e0; } li { margin: .8rem 0; } code { font-size: .75rem; color: #888; word-break: break-all; }
          </style></head>
          <body>
            <h1>🦄 Coding Unicorns $TAG</h1>
            <p>Windows: use the <code>.msi</code> installer. Linux / macOS: download the binary and <code>chmod +x</code> it.
            Installed copies update themselves.</p>
            <ul>$rows</ul>
          </body></html>
          HTML

          cat site/latest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
