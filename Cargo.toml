[package]
name = "coding-unicorns"
version = "0.11.3"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "coding-unicorns"
path = "src/main.rs"

[workspace]
members = ["crates/claude"]

[dependencies]
claude = { path = "crates/claude" }
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = "0.31"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "7"
git2 = "0.20"
portable-pty = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
fuzzy-matcher = "0.3"
crossbeam-channel = "0.5"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
libloading = "0.8"
rfd = "0.15"
egui-phosphor = "0.9"
vte = "0.13"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
egui_commonmark = { version = "0.20", features = ["better_syntax_highlighting"] }
# `platform-verifier`: trust the system's certificates, so HTTPS works behind
# a proxy or antivirus that re-signs traffic with its own root (installed in
# the Keychain / Windows store, unknown to the bundled webpki roots).
ureq = { version = "3", features = ["platform-verifier"] }
semver = "1"
sha2 = "0.10"
self-replace = "1"

# Outside Windows, git2 needs OpenSSL (libssh2 and HTTPS) and links the build
# machine's copy otherwise: the macOS binary then required Homebrew's
# /opt/homebrew/opt/openssl@3. Build OpenSSL and libgit2 into the binary.
[target.'cfg(not(windows))'.dependencies]
git2 = { version = "0.20", features = ["vendored-openssl", "vendored-libgit2"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# Embeds assets/icon.ico in the Windows executable (see build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
